services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_DB_URI: mongodb://mongo:27017
      APP_DB_NAME: jobtracker
      ALLOWED_ORIGINS: http://localhost:8000
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
