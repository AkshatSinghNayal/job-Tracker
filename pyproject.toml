[project]
name = "jobtracker"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "motor>=3.6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.10.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.5",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S", "A"]
ignore = [
  "S101", "B008",  # assert in tests; FastAPI Depends in defaults
  "S105",          # "token_type" literal is not a password
  "S110",          # deliberate try-except-pass for idempotent cleanup
  "A002",          # `filter` is the Mongo query param name
  "A005",          # app/core/logging.py intentionally named logging
  "B017",          # blind Exception asserts in GridFS-missing tests
  "UP038",
]

[tool.ruff.lint.per-file-ignores]
"scripts/seed_data.py" = ["E501"]  # long binary PDF template lines
