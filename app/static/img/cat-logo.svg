<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Ears -->
  <polygon points="12,26 18,6 30,18" fill="#F97316" stroke="#18181B" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="15,22 19,11 27,19" fill="#FFEDD5"/>
  <polygon points="52,26 46,6 34,18" fill="#F97316" stroke="#18181B" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="49,22 45,11 37,19" fill="#FFEDD5"/>
  
  <!-- Head base -->
  <ellipse cx="32" cy="34" rx="22" ry="19" fill="#F97316" stroke="#18181B" stroke-width="2.5"/>
  
  <!-- Forehead stripes -->
  <path d="M32 17 v6 M27 18.5 l2 4.5 M37 18.5 l-2 4.5" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Cheeks & Muzzle (White fluffy chin) -->
  <ellipse cx="26" cy="39" rx="8.5" ry="6.5" fill="#FFFDF8"/>
  <ellipse cx="38" cy="39" rx="8.5" ry="6.5" fill="#FFFDF8"/>
  <ellipse cx="32" cy="42" rx="7" ry="6" fill="#FFFDF8"/>
  
  <!-- Big Eyes -->
  <ellipse cx="24" cy="30" rx="4.5" ry="5" fill="#84CC16" stroke="#18181B" stroke-width="2"/>
  <circle cx="24" cy="30" r="2.8" fill="#18181B"/>
  <circle cx="22.5" cy="28.5" r="1.2" fill="#FFFFFF"/>
  
  <ellipse cx="40" cy="30" rx="4.5" ry="5" fill="#84CC16" stroke="#18181B" stroke-width="2"/>
  <circle cx="40" cy="30" r="2.8" fill="#18181B"/>
  <circle cx="38.5" cy="28.5" r="1.2" fill="#FFFFFF"/>
  
  <!-- Nose -->
  <polygon points="32,36 30,33.5 34,33.5" fill="#FB7185" stroke="#18181B" stroke-width="1.2" stroke-linejoin="round"/>
  
  <!-- Mouth -->
  <path d="M30 38 c-1 1.5 -2.5 1.5 -4 0.5 M34 38 c1 1.5 2.5 1.5 4 0.5" stroke="#18181B" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Whiskers -->
  <path d="M18 36 L7 34 M18 39 L6 39 M18 42 L8 44" stroke="#18181B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M46 36 L57 34 M46 39 L58 39 M46 42 L56 44" stroke="#18181B" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Collar -->
  <path d="M19 49 Q32 55 45 49" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Bell -->
  <circle cx="32" cy="54" r="5" fill="#FACC15" stroke="#18181B" stroke-width="2"/>
  <circle cx="32" cy="55.5" r="1.2" fill="#18181B"/>
  <line x1="32" y1="52" x2="32" y2="55.5" stroke="#18181B" stroke-width="1.2"/>
</svg>
